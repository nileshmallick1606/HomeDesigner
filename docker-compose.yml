version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: is-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interior}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interior_dev}
      POSTGRES_DB: ${POSTGRES_DB:-interior_science}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - interior-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U interior']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: is-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - interior-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: is-api
    ports:
      - '4000:4000'
    environment:
      - DATABASE_URL=postgresql://interior:interior_dev@postgres:5432/interior_science
      - REDIS_URL=redis://redis:6379
      - API_PORT=4000
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - interior-network

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: is-web
    ports:
      - '3000:3000'
    environment:
      - API_URL=http://api:4000
      - NODE_ENV=development
    depends_on:
      - api
    networks:
      - interior-network

  ai-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: is-ai-worker
    command: ['node', 'dist/main.js']
    working_dir: /app/apps/ai-worker
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://interior:interior_dev@postgres:5432/interior_science
      - NODE_ENV=development
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - model-cache:/app/models
    networks:
      - interior-network
    deploy:
      resources:
        limits:
          memory: 32G

  nginx:
    image: nginx:alpine
    container_name: is-nginx
    ports:
      - '80:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - interior-network

volumes:
  postgres-data:
  redis-data:
  model-cache:

networks:
  interior-network:
    driver: bridge
