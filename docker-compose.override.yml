version: '3.8'

# Development overrides — hot reload via volume mounts
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: development
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
    command: ['pnpm', '--filter', '@interior-science/api', 'dev']

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: development
    volumes:
      - ./apps/web/app:/app/apps/web/app
      - ./apps/web/public:/app/apps/web/public
      - ./packages/shared/src:/app/packages/shared/src
    command: ['pnpm', '--filter', '@interior-science/web', 'dev']
